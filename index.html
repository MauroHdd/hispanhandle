function esc(v){return String(v).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
function render(L){
  var t=T[L],d=data(L);
  document.documentElement.lang=L;
  document.querySelectorAll('[data-t]').forEach(function(el){el.textContent=t[el.getAttribute('data-t')];});
  document.querySelectorAll('template[data-for]').forEach(function(tp){
    while(tp.previousSibling&&tp.previousSibling.nodeType===1&&tp.previousSibling.hasAttribute('data-gen'))tp.previousSibling.remove();
    var as=tp.getAttribute('data-as'),html=tp.innerHTML;
    d[tp.getAttribute('data-for')].forEach(function(it){
      var h=html.replace(/\{\{\s*([\w.]+)\s*\}\}/g,function(_,k){var p=k.split('.');if(p[0]!==as)return '';var v=p.length>1?it[p[1]]:it;return esc(v==null?'':v);});
      var w=document.createElement('div');w.innerHTML=h.trim();
      Array.prototype.slice.call(w.children).forEach(function(c){c.setAttribute('data-gen','');tp.parentNode.insertBefore(c,tp);});
    });
  });
  document.querySelectorAll('.lang').forEach(function(b){b.setAttribute('aria-pressed',b.getAttribute('data-lang')===L?'true':'false');});
  try{localStorage.setItem('hh-lang',L);}catch(e){}
}
